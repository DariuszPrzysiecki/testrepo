apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spring-boot-api-ingress
spec:
  rules:
    - host: {{ .Values.ingress.hosts[0].host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: spring-boot-api-service
                port:
                  number: 8080
          - path: /logs
            pathType: Prefix
            backend:
              service:
                name: spring-boot-api-service
                port:
                  number: 8081
          - path: /soap
            pathType: Prefix
            backend:
              service:
                name: spring-boot-api-service
                port:
                  number: 8082
